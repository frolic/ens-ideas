name: Deploy production

# main = production. Every push to main deploys the stack to the `production`
# stage. No custom domain yet — the worker is reachable at its workers.dev URL
# (surfaced on the GitHub "production" environment). Attaching ensideas.com is a
# deliberate follow-up.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile

      # Builds Waku in-graph (Command.Build) then deploys the worker. Run under
      # bun so the alchemy CLI loads the .ts config natively.
      - id: deploy
        run: |
          set -o pipefail
          bun run deploy --stage production --yes | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | grep -- '-site-' | head -1)
          [ -z "$url" ] && url=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | grep -v 'alchemy-state-store' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
