name: Deploy production

# main = production. Every push to main deploys the stack to the `production`
# stage, surfaced as a GitHub Deployment (production environment). No custom
# domain yet: the worker is reachable at its workers.dev URL. Attaching
# ensideas.com is a deliberate follow-up.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/deploy
        with:
          ref: ${{ github.sha }}
          stage: production
          environment-prefix: production
          production: "true"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ethereum-rpc-url: ${{ secrets.ETHEREUM_RPC_URL }}
