name: Deploy production

# main = production. Every push to main deploys the stack to the `production`
# stage, surfaced as a GitHub Deployment (production environment) — same
# mechanism as the PR previews, driven explicitly via the Deployments API.
# No custom domain yet: the worker is reachable at its workers.dev URL.
# Attaching ensideas.com is a deliberate follow-up.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile

      - id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Production',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true,
            });
            core.setOutput('id', data.id);
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: data.id,
              state: 'pending',
              description: 'Deploying production',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      # Builds Waku in-graph (Command.Build) then deploys the worker. Run under
      # bun so the alchemy CLI loads the .ts config natively.
      - id: deploy
        run: |
          set -o pipefail
          bun run deploy --stage production --yes | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | grep -- '-site-' | head -1)
          [ -z "$url" ] && url=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | grep -v 'alchemy-state-store' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Terminal status: success carries the app URL; failure marks the
      # environment errored. Runs even if the deploy failed.
      - if: always() && steps.deployment.outputs.id
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ steps.deploy.outcome }}" === "success";
            const url = "${{ steps.deploy.outputs.url }}";
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: ok ? 'success' : 'error',
              description: ok ? 'Production deployed' : 'Production deploy failed',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ...(ok && url ? { environment_url: url } : {}),
              auto_inactive: true,
            });
