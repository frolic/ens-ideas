name: Deploy preview

# Every PR gets its own preview Worker on the `pr-<number>` stage, surfaced as a
# GitHub Deployment (the PR's "View deployment" link + Environments tab).
# Closing the PR tears the stage down and marks the environment inactive.
# Fork PRs are skipped (they can't access deploy secrets).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/deploy
        with:
          # Open the deployment against the PR *head* commit — GITHUB_SHA is the
          # merge commit on pull_request events, which breaks the PR link.
          ref: ${{ github.event.pull_request.head.sha }}
          stage: pr-${{ github.event.pull_request.number }}
          environment-prefix: preview/pr-${{ github.event.pull_request.number }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ethereum-rpc-url: ${{ secrets.ETHEREUM_RPC_URL }}

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run destroy --stage "pr-${{ github.event.pull_request.number }}" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The stage's resources are gone — mark every per-app environment
      # (preview/pr-N/<app>) and any stage-level failure deployment inactive so
      # the Environments tab reflects reality.
      - if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = `preview/pr-${context.issue.number}`;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo,
              per_page: 100,
            });
            const mine = deployments.filter(
              (deployment) =>
                deployment.environment === prefix ||
                deployment.environment.startsWith(`${prefix}/`),
            );
            for (const deployment of mine) {
              await github.rest.repos.createDeploymentStatus({
                ...context.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'PR closed — stage destroyed',
              });
            }
