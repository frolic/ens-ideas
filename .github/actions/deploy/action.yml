name: Deploy
description: >-
  Deploy a stage and record one GitHub Deployment per app (parsed from the
  alchemy stack output), each carrying its own URL. A failed deploy is recorded
  as a single stage-level error deployment and re-propagated so the job fails.

inputs:
  stage:
    description: Alchemy stage to deploy (e.g. production, pr-16).
    required: true
  environment-prefix:
    description: GitHub environment prefix; each app becomes <prefix>/<app> (e.g. preview/pr-16, production).
    required: true
  ref:
    description: Commit SHA to attach deployments to.
    required: true
  production:
    description: "'true' for production (non-transient) deployments."
    default: "false"
  cloudflare-api-token:
    required: true
  cloudflare-account-id:
    required: true
  ethereum-rpc-url:
    description: RPC URL bound into the api worker (ETHEREUM_RPC_URL).
    default: ""

runs:
  using: composite
  steps:
    # The wrapped task. continue-on-error keeps the composite alive so the
    # deployments are always recorded; the failure is re-propagated at the end.
    # Builds Waku in-graph (Command.Build) then deploys the workers; run under
    # bun so the alchemy CLI loads the .ts config natively.
    - id: run
      continue-on-error: true
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        ETHEREUM_RPC_URL: ${{ inputs.ethereum-rpc-url }}
      run: |
        set -o pipefail
        bun run deploy --stage "$STAGE" --yes | tee deploy.log

    # One GitHub Deployment per app. The app list + URLs come from the deploy
    # output itself — the stack's return value prints as `name: "url"` pairs —
    # so the workflow never hardcodes a copy of the apps. On failure (or no
    # apps parsed), a single stage-level deployment records the error.
    - if: always()
      uses: actions/github-script@v7
      env:
        ENVIRONMENT_PREFIX: ${{ inputs.environment-prefix }}
        REF: ${{ inputs.ref }}
        PRODUCTION: ${{ inputs.production }}
        OUTCOME: ${{ steps.run.outcome }}
      with:
        script: |
          const fs = require('fs');
          const ok = process.env.OUTCOME === 'success';
          const production = process.env.PRODUCTION === 'true';
          const prefix = process.env.ENVIRONMENT_PREFIX;
          const ref = process.env.REF;
          const logUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const log = fs.existsSync('deploy.log') ? fs.readFileSync('deploy.log', 'utf8') : '';
          const urls = {};
          for (const match of log.matchAll(/(\w+): ["'](https:\/\/[^"']+)["']/g)) urls[match[1]] = match[2];
          const apps = Object.entries(urls);

          const targets = ok && apps.length > 0
            ? apps.map(([name, url]) => ({ environment: `${prefix}/${name}`, url }))
            : [{ environment: prefix, url: undefined }];

          for (const target of targets) {
            const { data } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref,
              environment: target.environment,
              description: target.environment,
              auto_merge: false,
              required_contexts: [],
              transient_environment: !production,
              production_environment: production,
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: data.id,
              state: ok ? 'success' : 'error',
              description: ok ? 'Deployed' : 'Deploy failed',
              log_url: logUrl,
              ...(ok && target.url ? { environment_url: target.url } : {}),
              auto_inactive: true,
            });
          }

          if (apps.length > 0) {
            const lines = apps.map(([name, url]) => `- **${name}**: ${url}`);
            await core.summary.addRaw(['### Deploys', ...lines].join('\n')).write();
          }
          if (!ok) core.setFailed('deploy failed');
